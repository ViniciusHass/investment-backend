name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require uv project files
        run: |
          test -f pyproject.toml || { echo "::error::pyproject.toml is required"; exit 1; }
          test -f uv.lock || { echo "::error::uv.lock is required"; exit 1; }
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run backend tests
        run: uv run pytest tests
