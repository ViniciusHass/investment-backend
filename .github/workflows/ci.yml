name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository foundation
        id: project
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f src/main.py
          if test -f pyproject.toml || test -f uv.lock; then
            test -f pyproject.toml && test -f uv.lock || { echo "::error::Both pyproject.toml and uv.lock are required"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::uv project files are pending; dependency checks will start when both files exist"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up uv and Python
        if: steps.project.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        if: steps.project.outputs.ready == 'true'
        run: uv sync --locked --all-extras --dev
      - name: Compile Python source
        if: steps.project.outputs.ready == 'true'
        run: uv run python -m compileall -q src
